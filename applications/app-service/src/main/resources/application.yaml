server:
  port: 8080
spring:
  application:
    name: "ProductService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    schema: "${DB_SCHEMA}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
logging:
  level:
    root: "INFO"
    co.dev.victorroe: "DEBUG"
springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    enabled: true
    path: "/swagger-ui.html"
  packages-to-scan: "co.dev.victorroe.api"
  webjars:
    prefix: "/webjars"
adapter:
  sqs:
    region: "${SQS_REGION}"
    queueUrl: "${SQS_SENDER}"
#    endpoint: "http://localhost:4566 # For localstack only"

jwt:
  secret: ${JWT_SECRET}